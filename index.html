<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ece & Ata | Anılarımızı Paylaşın</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Ece ❤️ Ata</h1>

    <h2>Anılarımızı Paylaşın</h2>

    <p>
        Bu özel günümüzde çektiğiniz
        fotoğraf ve videoları
        bizimle paylaşabilirsiniz.
    </p>

    <input
        type="file"
        id="fileInput"
        multiple
        accept="image/*,video/*"
    >

    <button id="uploadBtn">
        Yükle
    </button>

    <div id="progress"></div>

    <div id="message"></div>

</div>

<script src="app.js"></script>

</body>
</html>
